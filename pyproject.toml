[project]
name = "lakehouse-rag-lab"
version = "0.1.0"
description = "Observable, zero-spend Lakehouse retrieval laboratory"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0", "pydantic==2.14.1", "uvicorn==0.52.1",
  "httpx==0.28.1", "langgraph==1.2.17", "qdrant-client==1.20.0",
  "lxml==6.1.1", "mcp==2.3.0"
]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0", "pip-audit==2.10.1", "types-lxml", "build", "hatchling==1.32.4"]
evaluation = ["mlflow-skinny==3.17.2"]
semantic = ["fastembed==0.9.1"]
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/lakehouse"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
[tool.mypy]
python_version = "3.12"
strict = true
[[tool.mypy.overrides]]
module = ["lxml.*", "mlflow.*", "fastembed.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]

[tool.hatch.build.targets.sdist]
exclude = ["work/", "evidence/", "frontend/node_modules/", ".venv/", ".git/"]
