name: quality-and-safety
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      MLFLOW_ALLOW_FILE_STORE: "true"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact uv
        run: python -m pip install uv==0.12.23
      - name: Install Python lockfile
        run: uv sync --frozen --group evaluation --group semantic
      - name: Format, lint, types, schemas
        run: |
          uv run ruff format --check backend tests scripts app.py
          uv run ruff check backend tests scripts app.py
          uv run mypy backend
          uv run python scripts/check_schema.py
      - name: Unit, retrieval, refusal, injection, quota and MCP tests
        run: uv run --group semantic pytest -q
      - name: Evaluation and local MLflow
        run: uv run --group evaluation python scripts/evaluate.py --mlflow
      - name: Audit Python
        run: uv run pip-audit --format json --output evidence/pip-audit.json
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Install and audit frontend
        run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=moderate
      - name: Secret detection
        run: git ls-files -z | xargs -0 frontend/node_modules/.bin/secretlint
      - name: Build browser companion and backend wheel
        run: |
          VITE_RUNTIME=browser npm run build --prefix frontend
          uv build --no-sources
          uv run python scripts/check_bundle.py
      - name: Real browser tests
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          uv run python scripts/verify_web.py
      - name: Docker build and schema validation
        run: |
          ANONYMIZATION_SECRET=ci-placeholder-never-use-in-production docker compose config --quiet
          docker build -t lakehouse-rag-lab:ci .
      - name: Preserve measured evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: measured-evidence
          path: evidence/
          retention-days: 7
