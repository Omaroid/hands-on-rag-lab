services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 12
  index:
    build: .
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: lakehouse_rag_lab_v1
    command: ["/app/.venv/bin/python", "scripts/index_qdrant.py", "--corpus", "corpus/editorial.json", "--prune"]
    depends_on:
      qdrant: {condition: service_healthy}
    restart: "no"
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_ORIGIN: http://localhost:8000
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: lakehouse_rag_lab_v1
      QUOTA_DB: /app/work/quotas.sqlite
      ANONYMIZATION_SECRET: ${ANONYMIZATION_SECRET:?Generate a local 64-character random secret in .env}
    volumes: ["quota-data:/app/work"]
    depends_on:
      index: {condition: service_completed_successfully}
    restart: "no"
volumes:
  qdrant-data:
  quota-data:
