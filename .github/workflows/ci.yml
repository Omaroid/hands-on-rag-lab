name: quality-and-safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Production secrets belong to Vercel, never to CI or fork pull requests.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdf-and-security:
    name: PDF app, Node API and secret safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify Python maintenance tools
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen
          uv run ruff format --check scripts
          uv run ruff check scripts
      - name: Scan complete Git history (redacted, checksum-pinned scanner)
        run: python scripts/check_secrets.py
      - name: Install immutable dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix frontend
      - name: Audit Node dependencies and scan tracked files
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix frontend --audit-level=moderate
          git ls-files -z | xargs -0 frontend/node_modules/.bin/secretlint
      - name: Validate the server API without any provider credential
        run: npm run test:server
      - name: Build and scan the public browser bundle
        run: |
          npm run build --prefix frontend
          python scripts/check_bundle.py
      - name: Use the browser supplied by the official Ubuntu runner
        run: |
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          "$browser_path" --version
          printf 'CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Real PDF, OCR and E5 tests on desktop and mobile emulation
        run: python scripts/verify_pdf.py --skip-build
      - name: Preserve only sanitized verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-verification
          path: work/pdf-verification.json
          if-no-files-found: ignore
          retention-days: 7
