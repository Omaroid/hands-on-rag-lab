[project]
name = "hands-on-rag-tools"
version = "0.1.0"
description = "Maintenance and verification tools for Hands-on RAG Lab"
requires-python = ">=3.12,<3.14"
dependencies = []
[dependency-groups]
dev = ["ruff==0.17.2"]
[tool.uv]
package = false
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
